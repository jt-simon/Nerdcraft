name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the same three commands as "Before you finish" in AGENTS.md, so local and CI can't drift.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Nerdcraft.slnx

      # Warnings are errors, and XML docs, style rules and SPDX headers are enforced here.
      - name: Build
        run: dotnet build Nerdcraft.slnx --no-restore

      - name: Check formatting
        run: dotnet format --verify-no-changes Nerdcraft.slnx --no-restore

      - name: Test
        run: dotnet test --solution Nerdcraft.slnx --no-build
